[package]
name = "caisson"
version = "0.1.3"
edition = "2021"
description = "Fast, native macOS CLI for daemon-shielded sibling APFS developer workspaces and Copy-on-Write git worktrees"
license = "MIT"
repository = "https://github.com/beckhq/caisson"
readme = "README.md"
keywords = ["macos", "apfs", "worktree", "git", "developer-tools"]
categories = ["command-line-utilities", "development-tools", "os::macos-apis"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
