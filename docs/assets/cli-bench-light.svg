<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="caisson bench terminal output">
  <defs><style>.m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }</style></defs>
  <rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 1 12 Q 1 1 12 1 L 748 1 Q 759 1 759 12 L 759 34 L 1 34 Z" fill="#1e293b"/>
  <line x1="1" y1="34" x2="759" y2="34" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="20" cy="17.5" r="5.5" fill="#ef4444" opacity="0.9"/>
  <circle cx="38" cy="17.5" r="5.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="56" cy="17.5" r="5.5" fill="#22c55e" opacity="0.9"/>
  <text x="380" y="21.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94a3b8">zsh · caisson bench (zero sudo)</text>
  <text x="20" y="58" class="m"><tspan fill="#34d399" font-weight="700">❯</tspan><tspan fill="#f1f5f9"> caisson bench</tspan></text>
  <rect x="20" y="72" width="720" height="34" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="23" y="75" width="714" height="28" rx="1" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <rect x="34" y="80" width="66" height="18" rx="2" fill="#38bdf8"/>
  <text x="67" y="93" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#042f2e">CAISSON</text>
  <text x="112" y="93" class="m" fill="#f1f5f9" font-weight="700">APFS &amp; Exec Micro-Benchmark</text>
  <text x="724" y="93" text-anchor="end" class="m" fill="#94a3b8">1000 files · Apple Silicon</text>
  <text x="20" y="128" class="m" xml:space="preserve"><tspan fill="#94a3b8">Target     : </tspan><tspan fill="#f1f5f9">/Volumes/caisson </tspan><tspan fill="#34d399" font-weight="700">[SHIELDED]</tspan><tspan fill="#94a3b8"> (apfs)</tspan></text>
  <text x="20" y="148" class="m" xml:space="preserve"><tspan fill="#94a3b8">Workload   : </tspan><tspan fill="#f1f5f9">1000 files (3.9 MiB synthetic package tree)</tspan></text>
  <text x="20" y="174" class="m" xml:space="preserve"><tspan fill="#f1f5f9" font-weight="700">1. Tree Cloning (clonefile CoW vs byte copy)</tspan></text>
  <text x="20" y="194" class="m" xml:space="preserve"><tspan fill="#f1f5f9">   APFS CoW   [</tspan><tspan fill="#34d399" font-weight="700">██</tspan><tspan fill="#94a3b8">░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#f1f5f9">]    3.37 ms  </tspan><tspan fill="#34d399" font-weight="700">(13.1x faster)</tspan></text>
  <text x="20" y="214" class="m" xml:space="preserve"><tspan fill="#94a3b8">   Byte copy  [</tspan><tspan fill="#94a3b8">████████████████████</tspan><tspan fill="#94a3b8">]   44.16 ms</tspan></text>
  <text x="20" y="240" class="m" xml:space="preserve"><tspan fill="#f1f5f9" font-weight="700">2. Teardown Primitive (rename to trash vs rm -rf)</tspan></text>
  <text x="20" y="260" class="m" xml:space="preserve"><tspan fill="#f1f5f9">   rename     [</tspan><tspan fill="#34d399" font-weight="700">▏</tspan><tspan fill="#94a3b8">░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#f1f5f9">]    0.07 ms  </tspan><tspan fill="#34d399" font-weight="700">(393.8x faster)</tspan></text>
  <text x="20" y="280" class="m" xml:space="preserve"><tspan fill="#94a3b8">   rm -rf     [</tspan><tspan fill="#94a3b8">████████████████████</tspan><tspan fill="#94a3b8">]   27.94 ms</tspan></text>
  <text x="20" y="306" class="m" xml:space="preserve"><tspan fill="#f1f5f9" font-weight="700">3. Fresh Local Binary Exec Latency (syspolicyd / Developer Tools)</tspan></text>
  <text x="20" y="326" class="m" xml:space="preserve"><tspan fill="#f1f5f9">   1st exec   [</tspan><tspan fill="#34d399" font-weight="700">█</tspan><tspan fill="#94a3b8">░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#f1f5f9">]    1.89 ms  </tspan><tspan fill="#34d399" font-weight="700">[FAST / EXEMPT]</tspan></text>
  <text x="20" y="346" class="m" xml:space="preserve"><tspan fill="#94a3b8">   Cached     [</tspan><tspan fill="#34d399">█</tspan><tspan fill="#94a3b8">░░░░░░░░░░░░░░░░░░░</tspan><tspan fill="#94a3b8">]    1.42 ms</tspan></text>
</svg>
