<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" viewBox="0 0 760 312" role="img" aria-label="Why .noindex and .sparseimage Fall Short (4-Way APFS Matrix)">
  <defs>
    <style>
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #e6edf3; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
      .t-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .t-sublbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e; }
      .t-sublbl-b { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #e6edf3; }
      .t-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #e6edf3; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #8b949e; }
      .t-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .t-sec { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #e6edf3; }
      .t-kpi { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #2dd4bf; }
      .t-kpi-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8b949e; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="311" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="20" y="18" width="66" height="20" rx="4" fill="#1f6feb"/>
  <text x="53" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#ffffff">CAISSON</text>
  <text x="96" y="33" class="t-title">Why .noindex and .sparseimage Fall Short (4-Way APFS Matrix)</text>
  <text x="20" y="54" class="t-sub">12 parallel git worktrees + 600-file compile + 15k small-file write storm on Apple Silicon APFS</text>
  <line x1="20" y1="66" x2="740" y2="66" stroke="#21262d" stroke-width="1"/>

  <rect x="20" y="80" width="352" height="212" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="104" class="t-sec">Spotlight (mds_stores) CPU · lower is better</text>
  <text x="36" y="133" class="t-sublbl">Main APFS (/)</text>
  <rect x="36" y="139" width="163.3" height="14" rx="3" fill="#484f58"/>
  <text x="207.3" y="150" class="t-val" fill="#e6edf3">7.80 s</text>
  <text x="36" y="173" class="t-sublbl">Main + .noindex</text>
  <rect x="36" y="179" width="156.8" height="14" rx="3" fill="#f59e0b"/>
  <text x="200.8" y="190" class="t-val" fill="#e6edf3">7.49 s</text>
  <rect x="275" y="175" width="83" height="20" rx="10" fill="#3b2606" stroke="#d97706" stroke-width="1"/>
  <text x="316.5" y="188.5" text-anchor="middle" class="t-pill" fill="#fcd34d">~0% relief</text>

  <text x="36" y="213" class="t-sublbl">Shielded .sparseimage</text>
  <rect x="36" y="219" width="48.8" height="14" rx="3" fill="#6e7681"/>
  <text x="92.8" y="230" class="t-val" fill="#e6edf3">2.33 s</text>
  <text x="36" y="253" class="t-sublbl-b">Caisson Sibling APFS</text>
  <rect x="36" y="259" width="4.0" height="14" rx="3" fill="#2dd4bf"/>
  <text x="48.0" y="270" class="t-val" fill="#2dd4bf">0.06 s</text>
  <rect x="298" y="255" width="60" height="20" rx="10" fill="#0d3b38" stroke="#14b8a6" stroke-width="1"/>
  <text x="328.0" y="268.5" text-anchor="middle" class="t-pill" fill="#5eead4">-99.2%</text>

  <rect x="388" y="80" width="352" height="212" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="404" y="104" class="t-sec">15k Small-File Write Storm · lower is better</text>
  <text x="404" y="133" class="t-sublbl">Main APFS (/)</text>
  <rect x="404" y="139" width="24.9" height="14" rx="3" fill="#484f58"/>
  <text x="436.9" y="150" class="t-val" fill="#e6edf3">0.58 s</text>
  <text x="404" y="173" class="t-sublbl">Main + .noindex</text>
  <rect x="404" y="179" width="24.5" height="14" rx="3" fill="#484f58"/>
  <text x="436.5" y="190" class="t-val" fill="#e6edf3">0.57 s</text>
  <text x="404" y="213" class="t-sublbl">Shielded .sparseimage</text>
  <rect x="404" y="219" width="156.9" height="14" rx="3" fill="#f87171"/>
  <text x="569.0" y="230" class="t-val" fill="#e6edf3">3.65 s</text>
  <rect x="637" y="215" width="89" height="20" rx="10" fill="#3f1518" stroke="#ef4444" stroke-width="1"/>
  <text x="681.5" y="228.5" text-anchor="middle" class="t-pill" fill="#fca5a5">6.7x slower</text>

  <text x="404" y="253" class="t-sublbl-b">Caisson Sibling APFS</text>
  <rect x="404" y="259" width="23.2" height="14" rx="3" fill="#2dd4bf"/>
  <text x="435.2" y="270" class="t-val" fill="#2dd4bf">0.54 s</text>
  <rect x="637" y="255" width="89" height="20" rx="10" fill="#0d3b38" stroke="#14b8a6" stroke-width="1"/>
  <text x="681.5" y="268.5" text-anchor="middle" class="t-pill" fill="#5eead4">native NVMe</text>

</svg>
