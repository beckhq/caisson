name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-universal-macos:
    name: Build universal macOS binary
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & Darwin targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon (arm64) release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel (x86_64) release binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary & checksums
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/caisson \
            target/x86_64-apple-darwin/release/caisson \
            -output dist/caisson
          chmod +x dist/caisson
          file dist/caisson
          dist/caisson --version

          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="caisson-${TAG}-universal-apple-darwin.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" caisson
          (cd dist && shasum -a 256 "${ARCHIVE}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/caisson-*-universal-apple-darwin.tar.gz
            dist/SHA256SUMS.txt
