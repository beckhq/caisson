name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag, formatting, Clippy, and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml package version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)"
          echo "Tag version: ${TAG_VER}, Cargo.toml version: ${PKG_VER}"
          if [ "${TAG_VER}" != "${PKG_VER}" ]; then
            echo "ERROR: Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${PKG_VER}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --locked

  build-universal-macos:
    name: Build universal macOS binary
    needs: [verify]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & Darwin targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon (arm64) release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build Intel (x86_64) release binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary, verify version & checksums
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/caisson \
            target/x86_64-apple-darwin/release/caisson \
            -output dist/caisson
          chmod +x dist/caisson
          file dist/caisson

          TAG="${GITHUB_REF_NAME}"
          EXPECTED="caisson ${TAG#v}"
          ACTUAL="$(dist/caisson --version)"
          echo "Binary reports: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "ERROR: Expected '${EXPECTED}', got '${ACTUAL}'."
            exit 1
          fi

          ARCHIVE="caisson-${TAG}-universal-apple-darwin.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" caisson
          (cd dist && shasum -a 256 "${ARCHIVE}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/caisson-*-universal-apple-darwin.tar.gz
            dist/SHA256SUMS.txt
